# Builds the Windows installer (PROJECT_NOTES §3).
# A v* tag publishes it as a GitHub Release. A push to a release/ branch or a manual run only
# keeps it under the run's Artifacts, for a test build.
name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write  # publishes the release on a tag
    env:
      PYTHON_VERSION: "3.11.9"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate the release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content "packaging\VERSION" -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match packaging\VERSION ($version)."
          }

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt -r requirements-print-helper.txt

      - name: Check the source
        run: python -m compileall -q apps config launcher print_helper serve.py

      - name: Install PDF libraries (Pango)
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-pango"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, check and package
        shell: pwsh
        run: ./packaging/build_windows.ps1 -SkipInstall

      - name: Create the build record and checksums
        shell: pwsh
        run: |
          $version = (Get-Content "packaging\VERSION" -Raw).Trim()
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release\windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $name = "SehatDesk-Setup-$version.exe"
          $installer = Join-Path $releaseDir $name
          Copy-Item -LiteralPath "dist\$name" -Destination $installer -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $helperName = "SehatDesk-Print-Setup-$version.exe"
          $helperInstaller = Join-Path $releaseDir $helperName
          Copy-Item -LiteralPath "dist\$helperName" -Destination $helperInstaller -Force
          $helperHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $helperInstaller).Hash.ToLowerInvariant()
          "$hash  $name", "$helperHash  $helperName" | Set-Content -Encoding ascii (Join-Path $releaseDir "SHA256SUMS.txt")

          $record = [ordered]@{
            application = "SehatDesk"
            version = $version
            commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            workflow_run = $env:GITHUB_RUN_ID
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            runner = "windows-2022"
            python = (& python --version).Trim()
            installer = $name
            installer_sha256 = $hash
            signed = $false
          }
          $record | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $releaseDir "build-manifest.json")
          python -m pip freeze | Set-Content -Encoding utf8 (Join-Path $releaseDir "python-packages.txt")

      - name: Upload the Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SehatDesk-Windows-${{ github.run_number }}
          path: release/windows/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content "packaging\VERSION" -Raw).Trim()
          $assets = @(
            "release\windows\SehatDesk-Setup-$version.exe"
            "release\windows\SehatDesk-Print-Setup-$version.exe"
            "release\windows\SHA256SUMS.txt"
          )
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assets --clobber
          } else {
            & gh release create $tag @assets --latest --title "SehatDesk $tag" --notes "$(git log -1 --pretty=%s)"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the release failed."
          }
