{# Medicine search results. Clicking one fills the add form (handled by Alpine in _panel.html). #}
{% if q|length >= 2 %}
<ul class="pick-list" role="listbox" aria-label="Medicines">
  {% for m in results %}
    <li><button type="button" class="pick-row" role="option" data-med-id="{{ m.pk }}" data-med-name="{{ m.display_name }}" data-med-generic="{{ m.generic_name }}" data-med-route="{{ m.route }}">
      <span class="pick-title col-span-2">{{ m.display_name }}</span><span class="pick-sub col-span-2">{{ m.generic_name }} · {{ m.get_form_display }}{% if m.manufacturer %} · {{ m.manufacturer }}{% endif %}</span>
    </button></li>
  {% empty %}
    <li class="px-3 py-2 text-label text-muted">No medicine matches “{{ q }}”. You can still add it as free text.</li>
  {% endfor %}
</ul>
{% endif %}
