{% extends "layouts/app.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<form method="post" class="card max-w-2xl space-y-4">{% csrf_token %}
  <div class="grid gap-4 md:grid-cols-2">{% for field in form %}{% include "components/field.html" with field=field %}{% endfor %}</div>
  <div class="flex gap-3"><button class="btn btn-primary">Save</button><a href="{% url 'ipd:setup' %}" class="btn btn-ghost">Cancel</a></div>
</form>
{% endblock %}
